server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: docflow-ai-backend
  datasource:
    url: ${DOCFLOW_DB_URL:jdbc:mysql://localhost:3306/docflow_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DOCFLOW_DB_USERNAME:root}
    password: ${DOCFLOW_DB_PASSWORD:123456}
    driver-class-name: ${DOCFLOW_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000
      pool-name: DocflowHikariCP
  data:
    redis:
      host: ${DOCFLOW_REDIS_HOST:localhost}
      port: ${DOCFLOW_REDIS_PORT:6379}
      database: ${DOCFLOW_REDIS_DATABASE:0}
      timeout: ${DOCFLOW_REDIS_TIMEOUT:5s}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    encoding: UTF-8
    table: flyway_schema_history
    out-of-order: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  file:
    path: ${DOCFLOW_LOG_PATH:logs}
  level:
    root: INFO
    com.docflow.ai: INFO
    org.springframework.security: INFO
    com.baomidou.mybatisplus: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${DOCFLOW_JWT_SECRET:change-this-secret-in-dev-change-this-secret}
    expire-seconds: ${DOCFLOW_JWT_EXPIRE_SECONDS:7200}
    refresh-expire-seconds: ${DOCFLOW_JWT_REFRESH_EXPIRE_SECONDS:604800}
  ai:
    claim-stale-after: ${DOCFLOW_AI_CLAIM_STALE_AFTER:2h}


# ==================== Resilience4j ====================
resilience4j:
  circuitbreaker:
    instances:
      ai-service:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        event-consumer-buffer-size: 20
      external-api:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 3
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
  retry:
    instances:
      ai-service:
        max-attempts: 3
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - com.docflow.ai.exception.BusinessException
      external-api:
        max-attempts: 2
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  timelimiter:
    instances:
      ai-service:
        timeout-duration: 10s
      external-api:
        timeout-duration: 5s
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: docflow-ai-backend
  health:
    diskspace:
      enabled: true
    db:
      enabled: true
    redis:
      enabled: true